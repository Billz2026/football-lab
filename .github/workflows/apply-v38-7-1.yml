name: Apply V38.7.1 premium match ball

on:
  push:
    paths:
      - "tools/apply-v38-7-1.mjs"
      - ".github/workflows/apply-v38-7-1.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V38.7.1 presentation patch
        run: node tools/apply-v38-7-1.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
          node --check sw.js
      - name: Verify single-ball contract
        run: |
          grep -q 'drawPremiumMatchBall' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'single-crisp-black-white-panel-match-ball-subtle-tapered-ribbon' app.js
          if grep -A60 'function drawTrail(progress)' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js | grep -q 'ctx.arc(projected.x, projected.y'; then
            echo 'Circular trail particles still exist'
            exit 1
          fi
      - name: Guard gameplay systems
        run: |
          git diff --exit-code HEAD -- game/runtime-v23-bridge-physics-v19-f1d39f9409.js game/keeper-ai-v34.js game/difficulty-v9.js game/core-v6.js
      - name: Commit V38.7.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js sw.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          if git diff --cached --quiet; then
            echo "No V38.7.1 changes to commit"
            exit 0
          fi
          git commit -m "Build V38.7.1 premium black and white match ball"
          git push
