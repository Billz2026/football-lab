name: V46 validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-v46-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Install test dependencies
        run: npm install

      - name: Verify production character asset contract
        run: npm run verify:characters:v1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify committed V46 production render bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drawHeroCharacterV46' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          grep -q 'character-3d-v46.js' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          grep -q '__footballLabCharacterRendererBridgeV46 = true' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js

      - name: Test committed production bundle before regeneration
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/character-v46.spec.js --reporter=line 2>&1 | tee committed-v46-output.txt

      - name: Verify static runtime render-bridge parity
        shell: bash
        run: |
          set -euo pipefail
          npm run build:runtime:v23
          npm run verify:runtime:v23
          git diff --exit-code -- game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js

      - name: Run current browser regression suite
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/runtime-v23.spec.js tests/campaign-v41.spec.js tests/character-v42.spec.js tests/character-production-v1.spec.js tests/character-v43.spec.js tests/character-v46.spec.js --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v46-validation-${{ github.run_id }}
          path: |
            committed-v46-output.txt
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
