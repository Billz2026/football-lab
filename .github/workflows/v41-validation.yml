name: Football Lab Manager V0.3 validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-manager-v03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './node_modules/*' -print0)

      - name: Install test dependencies
        run: npm ci

      - name: Validate the playable database
        run: npm run validate:database

      - name: Test career simulation
        run: node --test tests/manager-core.test.js

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Run manager browser regression suite
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci -- --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-v03-validation-${{ github.run_id }}
          path: |
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
