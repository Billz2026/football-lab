name: Arcade runtime validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-arcade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Verify committed arcade render bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'drawArcadeHeroCharacterV51' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          grep -q 'arcade-character-v51.js' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          grep -q '__footballLabArcadeCharacterRendererV51 = true' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          grep -q 'polished-modern-arcade-articulated-2.5d' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          if grep -q 'character-3d-v46.js' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js; then
            echo 'Legacy V46 GLB renderer is still wired into the live static bridge.' >&2
            exit 1
          fi

      - name: Verify static runtime
        run: npm run verify:runtime:v23

      - name: Test arcade characters
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/character-arcade-v50-visual.spec.js \
            tests/character-v42.spec.js \
            --workers=1 --reporter=line 2>&1 | tee arcade-character-output.txt

      - name: Verify static runtime render-bridge parity
        shell: bash
        run: |
          set -euo pipefail
          cp game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js /tmp/arcade-bridge-before.js
          npm run build:runtime:v23
          npm run verify:runtime:v23
          diff -u /tmp/arcade-bridge-before.js game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js

      - name: Run non-character browser regressions
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test \
            tests/runtime-v23.spec.js \
            tests/campaign-v41.spec.js \
            tests/strike-v32-4.spec.js \
            tests/physics-consistency.spec.js \
            tests/input-precision.spec.js \
            tests/mobile-shell.spec.js \
            --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-validation-${{ github.run_id }}
          path: |
            arcade-character-output.txt
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
