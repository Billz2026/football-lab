name: V41 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-v41-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "${file}"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify static runtime
        run: |
          npm run build:runtime:v23
          npm run verify:runtime:v23

      - name: Run current browser regression suite
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/runtime-v23.spec.js tests/campaign-v41.spec.js --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v41-validation-${{ github.run_id }}
          path: |
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
