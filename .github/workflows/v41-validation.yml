name: Football Lab Manager validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-manager-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            manager.js \
            manager-runtime-v1.js \
            runtime-foundation-v1.js \
            runtime-matchday-v1.js \
            runtime-match-centre-v1.js \
            runtime-career-integrity-v1.js \
            runtime-commentary-v1.js \
            match-centre-v5.js \
            manager-core.js \
            world-clock-v060.js \
            career-world-v060.js \
            transfers-v050.js \
            career-manager-start-v064.js \
            career-personality-v2.js \
            appointment-media-core-v1.js \
            career-appointment-media-v066.js \
            board-expectations-v067.js \
            match-integrity-core-v067.js \
            career-integrity-v067.js \
            national-league-step-three-world-v1.js \
            national-league-step-four-world-v1.js \
            national-league-step-five-world-v1.js \
            national-league-step-five-membership-resolved-v1.js \
            national-league-step-six-world-v1.js \
            national-league-step-six-simulation-resolved-v1.js \
            procedural-lower-feeder-v1.js \
            english-pyramid-world-v6.js \
            english-pyramid-world-v7.js \
            english-pyramid-world-v8.js \
            english-pyramid-world-v9.js \
            english-pyramid-world-v10.js \
            season-finalisation-v6.js \
            season-finalisation-v7.js \
            season-finalisation-v8.js \
            season-finalisation-v9.js \
            season-finalisation-v10.js \
            matchday-live-v04.js \
            matchday-engine-v069.js \
            matchday-engine-v0431.js \
            matchday-engine-v043.js \
            matchday-engine-v042.js \
            match-centre-v0451.js \
            kit-colours-v1.js \
            matchday-runtime-fixes-v070.js \
            player-profile-v2.js \
            match-fulltime-single-continue-v064.js \
            scripts/validate-database.mjs \
            tests/manager-career.spec.js \
            tests/manager-core.test.js \
            tests/english-pyramid-world-v6.test.js \
            tests/english-pyramid-world-v7.test.js \
            tests/english-pyramid-world-v8.test.js \
            tests/step-five-membership-resolution-v1.test.js \
            tests/english-pyramid-world-v9.test.js \
            tests/step-six-resolution-v1.test.js \
            tests/procedural-lower-feeder-v1.test.js \
            tests/match-integrity-engine-v067.test.js \
            tests/kit-colours-v1.test.js \
            tests/matchday-v070.spec.js \
            tests/career-manager-v064.spec.js \
            tests/personality-v2.test.js \
            tests/appointment-media-v1.test.js \
            tests/appointment-media-v066.spec.js \
            tests/integrity-v067.test.js \
            tests/player-profile-v2.spec.js \
            tests/world-clock.test.js \
            tests/world-clock.spec.js; do
            echo "Checking ${file}"
            node --check "${file}"
          done

      - name: Install test dependencies
        run: npm ci

      - name: Validate the playable database
        run: npm run validate:database

      - name: Test career simulation
        run: node --test tests/manager-core.test.js tests/english-pyramid-world-v6.test.js tests/english-pyramid-world-v7.test.js tests/english-pyramid-world-v8.test.js tests/step-five-membership-resolution-v1.test.js tests/english-pyramid-world-v9.test.js tests/step-six-resolution-v1.test.js tests/procedural-lower-feeder-v1.test.js tests/match-integrity-engine-v067.test.js tests/world-clock.test.js tests/personality-v2.test.js tests/appointment-media-v1.test.js tests/integrity-v067.test.js tests/kit-colours-v1.test.js

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Run manager browser regression suite
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci -- --reporter=line,html 2>&1 | tee playwright-output.txt

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manager-validation-${{ github.run_id }}
          path: |
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
