name: Apply V38.7 flight camera composition

on:
  push:
    paths:
      - "tools/apply-v38-7.mjs"
      - ".github/workflows/apply-v38-7.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V38.7 presentation patch
        run: node tools/apply-v38-7.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/flight-v33.js
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
      - name: Verify camera contract
        run: |
          grep -q 'goal-first-destination-biased-flight-composition' game/flight-v33.js
          grep -q 'kickerClearsFrame' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'cameraFinalApproach' app.js
      - name: Guard gameplay systems
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Eq '(^|/)(physics|difficulty|keeper-ai|skill-balance|strike-v32-4)'; then
            echo 'V38.7 touched a protected gameplay system'
            exit 1
          fi
      - name: Commit V38.7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js game/flight-v33.js game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          if git diff --cached --quiet; then
            echo "No V38.7 changes to commit"
            exit 0
          fi
          git commit -m "Build V38.7 flight camera and shot composition"
          git push
