name: FLM API-Football Player Full Names

on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: 'Maximum profile lookups this run (1-95)'
        required: true
        default: '90'
  push:
    branches:
      - main
    paths:
      - 'scripts/enrich-api-football-player-names.mjs'
      - '.github/workflows/api-football-player-name-enrichment.yml'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: flm-player-name-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FLM_NAME_ENRICH_MAX_REQUESTS: ${{ github.event.inputs.max_requests || '90' }}
      FLM_REQUEST_DELAY_MS: '7000'
      FLM_DAILY_RESERVE: '5'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify API-Football secret
        shell: bash
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY repository secret is missing."
            exit 1
          fi
          echo "API-Football secret is configured."

      - name: Check enrichment script syntax
        run: node --check scripts/enrich-api-football-player-names.mjs

      - name: Enrich abbreviated player names
        run: node scripts/enrich-api-football-player-names.mjs

      - name: Validate database
        run: node scripts/validate-database.mjs data/current

      - name: Show enrichment summary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('artifacts/player-name-enrichment-report.json', 'utf8'));
          console.log(`Candidates before: ${report.candidatesBefore}`);
          console.log(`Resolved this run: ${report.resolvedCount}`);
          console.log(`Attempted but unresolved: ${report.unresolvedAttemptedCount}`);
          console.log(`Abbreviated names remaining: ${report.remainingAbbreviatedCount}`);
          console.log(`API calls used: ${report.apiCalls}`);
          console.log(`Remaining daily requests: ${report.quota.lastKnownRemaining ?? 'unknown'}`);
          NODE

      - name: Commit enriched names
        shell: bash
        run: |
          if git diff --quiet -- data/current/players.json; then
            echo "No player-name changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/players.json
          git commit -m "Enrich API-Football player full names"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload enrichment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-name-enrichment-${{ github.run_id }}
          path: artifacts/player-name-enrichment-report.json
          if-no-files-found: warn
          retention-days: 7
