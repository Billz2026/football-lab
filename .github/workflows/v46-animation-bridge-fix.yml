name: V46 animation bridge fix

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-animation-bridge-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Patch authoritative V46 animation bridge
        run: python3 scripts/patch-v46-animation-bridge.py
      - name: Verify patch markers
        run: |
          grep -q '__footballLabAuthoritativeStateV46 = state' game/main-v18.js
          grep -q 'keeperClipFromAuthoritativePlan' game/character-3d-v46.js
          grep -q 'const gameState = liveState();' game/character-3d-v46.js
      - name: Commit bridge fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/main-v18.js game/character-3d-v46.js
          git commit -m 'Fix V46 live animation state bridge'
          git push origin HEAD:agent/v46-real-3d-character-layer
