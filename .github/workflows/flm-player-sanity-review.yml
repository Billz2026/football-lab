name: FLM Player Sanity Review

on:
  push:
    branches: [main]
    paths:
      - 'scripts/run-flm-player-sanity-review.mjs'
      - 'scripts/build-flm-rating-engine-v1-1-calibration.mjs'
      - 'scripts/build-flm-rating-engine-v1-rounds.mjs'
      - '.github/workflows/flm-player-sanity-review.yml'
      - 'data/rating/flm-rating-engine-v1-1-freeze.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flm-player-sanity-review
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Sportmonks secret
        shell: bash
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SPORTMONKS_API_TOKEN:-}"

      - name: Run player sanity review
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node scripts/run-flm-player-sanity-review.mjs artifacts/flm-player-sanity-review.json artifacts/flm-rating-engine-v1-1-sanity-base.json artifacts/flm-rating-engine-v1-sanity-base.json

      - name: Upload sanitised sanity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flm-player-sanity-review-${{ github.run_id }}
          path: artifacts/flm-player-sanity-review.json
          if-no-files-found: error
          retention-days: 3
