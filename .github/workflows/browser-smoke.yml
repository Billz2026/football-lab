name: Browser smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: football-lab-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        id: browser-tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --max-failures=1 --reporter=line,html 2>&1 | tee playwright-output.txt
      - name: Upload browser test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-${{ github.run_id }}
          path: |
            playwright-output.txt
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
