name: Sportmonks free access probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/provider/sportmonks-probe.trigger'

permissions:
  contents: read

concurrency:
  group: sportmonks-free-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secret is configured
        shell: bash
        run: |
          if [ -z "${SPORTMONKS_API_TOKEN:-}" ]; then
            echo 'SPORTMONKS_API_TOKEN is not configured for this repository.'
            exit 1
          fi
          echo 'Sportmonks secret is available to the workflow.'

      - name: Probe subscription and squad access
        run: node scripts/probe-sportmonks.mjs artifacts/sportmonks-access-report.json

      - name: Upload sanitised access report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-access-report-${{ github.run_id }}
          path: artifacts/sportmonks-access-report.json
          if-no-files-found: warn
          retention-days: 3
