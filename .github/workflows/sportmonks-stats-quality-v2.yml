name: Sportmonks player stats quality v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analyse-sportmonks-player-stats.mjs'
      - '.github/workflows/sportmonks-stats-quality-v2.yml'
      - 'data/provider/sportmonks-stats-quality.trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sportmonks-player-stats-quality-v2
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify secret is configured
        shell: bash
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SPORTMONKS_API_TOKEN:-}"

      - name: Analyse team-season player statistics and provisional ratings
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node scripts/analyse-sportmonks-player-stats.mjs artifacts/sportmonks-player-stats-quality-report.json

      - name: Upload sanitised stats quality report only
        uses: actions/upload-artifact@v4
        with:
          name: sportmonks-player-stats-quality-${{ github.run_id }}
          path: artifacts/sportmonks-player-stats-quality-report.json
          if-no-files-found: error
          retention-days: 3
