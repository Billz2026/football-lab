name: Apply V40.1 premium pitch

on:
  push:
    paths:
      - "tools/apply-v40-1.mjs"
      - ".github/workflows/apply-v40-1.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize stale V39 service worker baseline
        run: |
          sed -i 's|// Football Lab V39 character motion cache reset|// Football Lab V38.8 cinematic payoff cache reset|' sw.js
          sed -i 's|football-lab-shell-v39-0-0|football-lab-shell-v39-1-0|g' sw.js
          sed -i 's|app.js?v=39.0.0|app.js?v=39.1.0|g' sw.js
      - name: Apply V40.1 premium pitch
        run: node tools/apply-v40-1.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
          node --check sw.js
      - name: Verify V40.1 pitch contracts
        run: |
          grep -q '__footballLabPitchV401' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'cross-cut-depth-graded' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'deterministic-device-scaled' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'fold-mobile' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'paintPitchLine' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'pitchSurface:' app.js
          grep -q 'pitchQualityScaling:' app.js
          grep -q 'build: "40.1.0"' app.js
      - name: Guard frozen gameplay and character systems
        run: |
          git diff --exit-code HEAD -- \
            game/runtime-v23-bridge-physics-v19-f1d39f9409.js \
            game/physics-v7.js \
            game/flight-v33.js \
            game/keeper-ai-v34.js \
            game/keeper-visuals-v38-1.js \
            game/difficulty-v9.js \
            game/skill-balance-v37.js \
            game/core-v6.js \
            game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
      - name: Commit V40.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          if git diff --cached --quiet; then
            echo "No V40.1 changes to commit"
            exit 0
          fi
          git commit -m "Build V40.1 premium pitch"
          git push
