name: Apply V40.2D authoritative canvas outcome feedback

on:
  push:
    paths:
      - "tools/apply-v40-2d.mjs"
      - ".github/workflows/apply-v40-2d.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V40.2D patch
        run: node tools/apply-v40-2d.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
          node --check sw.js
      - name: Verify V40.2D outcome contracts
        run: |
          grep -q 'function drawOutcomeStingV402D' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'drawOutcomeStingV402D(time);' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'SAVED · PARRIED' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'OFF THE POST' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'CROSSBAR' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'BLOCKED' game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          grep -q 'visible-on-desktop-fold-mobile' app.js
          grep -q 'badge.textContent = "V40.2D"' app.js
      - name: Guard frozen gameplay systems
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          allowed='^(app\.js|sw\.js|game/runtime-v23-main\.js|game/runtime-v23-generated-render-v15-v1731-1b04a249af\.js|game/runtime-v23-generated-render-v17-v1731-7f257084b1\.js|game/runtime-v23-bridge-render-v17-3-1-64b7ab3399\.js)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected gameplay/system files changed:"
            echo "$bad"
            exit 1
          fi
          git diff -U0 -- game/runtime-v23-main.js | grep -E '^[+-][^+-].*(resolveShotPhysics|function scoreShot|difficultyForStage|keeperForStage)' && { echo 'Frozen gameplay line changed unexpectedly'; exit 1; } || true
      - name: Commit V40.2D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          if git diff --cached --quiet; then
            echo "No V40.2D changes to commit"
            exit 0
          fi
          git commit -m "Build V40.2D authoritative canvas outcome feedback"
          git push
