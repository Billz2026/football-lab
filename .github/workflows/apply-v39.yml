name: Apply V39 character motion overhaul

on:
  push:
    paths:
      - "tools/apply-v39.mjs"
      - ".github/workflows/apply-v39.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V39 character/wall patch
        run: node tools/apply-v39.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
          node --check sw.js
      - name: Verify V39 motion contracts
        run: |
          grep -q '__footballLabCharacterMotionV39' game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          grep -q 'hip-drive' game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          grep -q 'lower-leg-snap' game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          grep -q 'recovery-cross-step' game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          grep -q '__footballLabWallAnimationV39' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'individualTiming: true' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'characterMotion:' app.js
          grep -q 'wallMotion:' app.js
      - name: Guard frozen gameplay systems
        run: |
          git diff --exit-code HEAD -- \
            game/runtime-v23-bridge-physics-v19-f1d39f9409.js \
            game/physics-v7.js \
            game/flight-v33.js \
            game/keeper-ai-v34.js \
            game/keeper-visuals-v38-1.js \
            game/difficulty-v9.js \
            game/skill-balance-v37.js \
            game/core-v6.js
      - name: Commit V39
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js \
            game/runtime-v23-generated-hero-kicker-v17-3-1-7c97a59e31.js
          if git diff --cached --quiet; then
            echo "No V39 changes to commit"
            exit 0
          fi
          git commit -m "Build V39 character motion overhaul"
          git push
