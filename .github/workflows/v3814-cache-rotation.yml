name: V38.1.4 cache rotation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v3814-cache-rotation.yml

permissions:
  contents: write

jobs:
  rotate-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rotate Football Lab cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sw.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '// Football Lab V38.1.3 aim risk halo removal cache generation',
              '// Football Lab V38.1.4 final circular aim overlay removal cache generation'
          )
          text = text.replace(
              'const CACHE_NAME = "football-lab-shell-v38-1-3";',
              'const CACHE_NAME = "football-lab-shell-v38-1-4";'
          )
          cleanup = '  "./game/final-aim-cleanup-v38-1-4.js?v=38.1.4",'
          visual = '  "./game/visual-ui-v17.js?v=32.4",'
          if cleanup not in text:
              text = text.replace(visual, visual + '\n' + cleanup)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cache rotation
        shell: bash
        run: |
          if git diff --quiet -- sw.js; then
            echo "sw.js already rotated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git commit -m "V38.1.4 rotate service-worker cache"
          git push origin HEAD:main
