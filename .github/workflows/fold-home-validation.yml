name: Fold Home Layout validation

on:
  push:
    branches: [main]
    paths:
      - 'manager.css'
      - 'manager.js'
      - 'mobile-home-v049.js'
      - 'mobile-home-v049.css'
      - 'tests/mobile-home.spec.js'
      - '.github/workflows/fold-home-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager.css'
      - 'manager.js'
      - 'mobile-home-v049.js'
      - 'mobile-home-v049.css'
      - 'tests/mobile-home.spec.js'
      - '.github/workflows/fold-home-validation.yml'

jobs:
  validate-fold-home:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run Fold home regression
        run: npx playwright test tests/mobile-home.spec.js --config=playwright.ci.config.js --reporter=line --workers=1
