name: V37 skill balance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: football-lab-v37-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skill-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V37 skill balance tests
        run: npx playwright test tests/skill-balance-v37.spec.js --reporter=line