name: V46 contact hold fix

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-contact-hold-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Restore known-good source and extend contact pose
        run: |
          git checkout 891ffb65d1b77876f103a4097e94105df0e3f856 -- game/main-v11-3.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path('game/main-v11-3.js')
          text = path.read_text()
          needle = 'const contactHoldDuration = 64;'
          if text.count(needle) != 1:
              raise SystemExit(f'expected one contact hold declaration, found {text.count(needle)}')
          path.write_text(text.replace(needle, 'const contactHoldDuration = 140;', 1))
          PY
          git diff --check
      - name: Commit intended one-line runtime-source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/main-v11-3.js
          git commit -m 'Make strike contact pose readable'
          git push origin HEAD:agent/v46-real-3d-character-layer
