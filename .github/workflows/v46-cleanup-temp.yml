name: V46 temporary cleanup

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-cleanup-temp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Remove temporary V46 diagnostics and patch tooling
        run: |
          rm -f \
            .github/diagnostics/mikkel-v46-visual-output.txt \
            .github/workflows/v46-contact-hold-fix.yml \
            .github/workflows/v46-keeper-hook-fix.yml \
            .github/workflows/v46-mikkel-shot-gate-fix.yml \
            .github/workflows/v46-render-slot-fix.yml \
            .github/workflows/v46-state-identity-diagnostic.yml \
            scripts/patch-v46-keeper-hook.py \
            scripts/patch-v46-render-slot.py \
            tests/v46-keeper-hook-diagnostic.spec.js \
            tests/v46-live-state-diagnostic.spec.js \
            .github/workflows/v46-cleanup-temp.yml
          git diff --check
      - name: Commit clean release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean V46 temporary diagnostics'
          git push origin HEAD:agent/v46-real-3d-character-layer
