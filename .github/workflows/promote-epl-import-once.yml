name: Promote completed Premier League import once

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Promote completed EPL import artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download successful API import artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Billz2026/football-lab
          run-id: 33951695057
          name: api-football-epl-complete-33951695057
          path: artifacts/api-football-epl-complete

      - name: Validate downloaded 20-club database
        run: |
          node scripts/validate-database.mjs artifacts/api-football-epl-complete/merged-current
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const dir = 'artifacts/api-football-epl-complete/merged-current';
          const [metadata, clubs, players] = await Promise.all(['metadata.json','clubs.json','players.json'].map(async f => JSON.parse(await readFile(`${dir}/${f}`, 'utf8'))));
          const pl = clubs.filter(c => c.leagueId === 'eng-premier-league' && !c.isPlaceholder);
          if (pl.length !== 20) throw new Error(`Expected 20 Premier League clubs, found ${pl.length}.`);
          const playable = new Set(metadata.playableDemo?.clubIds || []);
          if (playable.size !== 20 || pl.some(c => !playable.has(c.id))) throw new Error('All 20 Premier League clubs are not marked playable.');
          const counts = Object.fromEntries(pl.map(c => [c.name, players.filter(p => p.clubId === c.id && !p.isPlaceholder).length]));
          const weak = Object.entries(counts).filter(([, count]) => count < 18);
          if (weak.length) throw new Error(`Squads below 18 players: ${JSON.stringify(weak)}`);
          const progress = metadata.importProgress?.['eng-premier-league'];
          if (progress?.realClubs !== 20 || progress?.status !== 'complete') throw new Error(`Premier League import progress not complete: ${JSON.stringify(progress)}`);
          console.log('20-club Premier League database is ready for promotion.');
          console.table(counts);
          NODE

      - name: Promote to data/current
        run: |
          for file in metadata.json leagues.json clubs.json players.json managers.json; do
            cp "artifacts/api-football-epl-complete/merged-current/$file" "data/current/$file"
          done
          node scripts/validate-database.mjs data/current
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/metadata.json data/current/leagues.json data/current/clubs.json data/current/players.json data/current/managers.json
          git commit -m "Complete 20-club Premier League database"
          git push origin HEAD:main
