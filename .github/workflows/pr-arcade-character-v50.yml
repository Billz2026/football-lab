name: Arcade Character V51 PR gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install chromium
      - run: npm run verify:runtime:v23
      - run: npx playwright test tests/character-arcade-v50-visual.spec.js --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-character-v51-pr-${{ github.run_id }}
          path: |
            test-results/arcade-v51-ready.png
            test-results/arcade-v51-strike.png
            test-results/arcade-v51-full-ui.png
          if-no-files-found: warn
          retention-days: 14
