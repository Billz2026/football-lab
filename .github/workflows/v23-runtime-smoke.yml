name: V23 runtime smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run V23 runtime tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/runtime-v23.spec.js --reporter=line 2>&1 | tee v23-runtime-output.txt
      - name: Upload V23 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-runtime-${{ github.run_id }}
          path: |
            v23-runtime-output.txt
            test-results/
          if-no-files-found: warn
          retention-days: 7
