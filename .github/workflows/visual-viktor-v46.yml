name: Viktor V46 visual gate

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - game/assets/characters/v1/outfield/viktor-kane/viktor-kane.glb
      - .github/workflows/visual-viktor-v46.yml
      - .github/v46-release-trigger
      - tests/character-v46-visual.spec.js
      - game/character-3d-v46.js
      - game/render-v17-3-1.js
      - game/core-v6.js
      - game/strike-v32-4.js
      - game/main-v18.js
      - game/main-v15-2.js
      - game/main-v11-3.js
      - scripts/capture-runtime-v23.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-viktor-v46-visual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V46 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build V46 runtime bridge
        run: npm run build:runtime:v23

      # This capture is the release visual gate for the re-authored kick mechanics.
      - name: Capture Viktor in gameplay
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/character-v46-visual.spec.js --reporter=line 2>&1 | tee viktor-v46-visual-output.txt

      - name: Upload visual gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viktor-v46-visual-gate-${{ github.run_id }}
          path: |
            test-results/viktor-v46-gameplay-ready.png
            test-results/viktor-v46-strike-windup.png
            test-results/viktor-v46-strike-contact.png
            test-results/viktor-v46-strike-follow-through.png
            test-results/viktor-v46-full-ui-ready.png
            viktor-v46-visual-output.txt
          if-no-files-found: warn
          retention-days: 14
