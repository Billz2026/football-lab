name: Viktor V46 visual gate

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - game/assets/characters/v1/outfield/viktor-kane/viktor-kane.glb
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-lab-viktor-v46-visual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V46 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Viktor in gameplay
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/character-v46-visual.spec.js --reporter=line 2>&1 | tee viktor-v46-visual-output.txt

      - name: Upload visual gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viktor-v46-visual-gate-${{ github.run_id }}
          path: |
            test-results/viktor-v46-gameplay-ready.png
            test-results/viktor-v46-full-ui-ready.png
            viktor-v46-visual-output.txt
          if-no-files-found: warn
          retention-days: 14
