name: V46 runtime state patch

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-runtime-state-patch.yml'
      - 'scripts/patch-v46-runtime-state.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Move publication to final runtime
        run: python3 scripts/patch-v46-runtime-state.py
      - name: Verify patch
        run: |
          grep -q '__footballLabAuthoritativeStateV46 = state' scripts/capture-runtime-v23.mjs
          ! grep -q '__footballLabAuthoritativeStateV46 = state' game/main-v11-3.js
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/capture-runtime-v23.mjs game/main-v11-3.js
          git commit -m 'Publish V46 state from final runtime'
          git push origin HEAD:agent/v46-real-3d-character-layer
