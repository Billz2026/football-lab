name: Complete Premier League import once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Run one-shot EPL completion import'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FLM_BATCH_OFFSET: '8'
      FLM_BATCH_COUNT: '12'
      FLM_REQUEST_DELAY_MS: '7000'
      FLM_DAILY_RESERVE: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify API-Football secret
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY repository secret is missing."
            exit 1
          fi
          echo "API-Football secret is configured."

      - name: Import remaining Premier League squads
        run: node scripts/import-api-football-english-free.mjs artifacts/api-football-epl-complete

      - name: Validate imported batch
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const dir = 'artifacts/api-football-epl-complete';
          const clubs = JSON.parse(await readFile(`${dir}/clubs-batch.json`, 'utf8'));
          const players = JSON.parse(await readFile(`${dir}/players-batch.json`, 'utf8'));
          const report = JSON.parse(await readFile(`${dir}/report.json`, 'utf8'));
          if (clubs.length !== 12) throw new Error(`Expected 12 Premier League clubs, imported ${clubs.length}.`);
          if (players.length < clubs.length * 15) throw new Error(`Squad coverage too low: ${players.length} players for ${clubs.length} clubs.`);
          if (clubs.some(c => c.leagueId !== 'eng-premier-league')) throw new Error('Batch contains a non-Premier League club.');
          if (players.some(p => p.isPlaceholder)) throw new Error('Imported batch contains placeholder players.');
          if (new Set(players.map(p => p.id)).size !== players.length) throw new Error('Imported batch contains duplicate player IDs.');
          console.log(`Validated batch: ${clubs.length} clubs, ${players.length} unique players.`);
          console.log(`Remaining daily requests: ${report.usage?.lastKnownRemainingDailyRequests ?? 'unknown'}`);
          NODE

      - name: Build merged database preview
        run: node scripts/merge-api-football-english-batch.mjs artifacts/api-football-epl-complete data/current artifacts/api-football-epl-complete/merged-current

      - name: Expand playable Premier League to all 20 clubs
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const dir = 'artifacts/api-football-epl-complete/merged-current';
          const metadata = JSON.parse(await readFile(`${dir}/metadata.json`, 'utf8'));
          const clubs = JSON.parse(await readFile(`${dir}/clubs.json`, 'utf8'));
          const premierLeague = clubs
            .filter(c => c.leagueId === 'eng-premier-league' && !c.isPlaceholder)
            .sort((a, b) => a.name.localeCompare(b.name));
          if (premierLeague.length !== 20) throw new Error(`Expected 20 real Premier League clubs after merge, found ${premierLeague.length}.`);
          metadata.playableDemo = {
            ...(metadata.playableDemo || {}),
            version: '0.5.0',
            competitionName: 'Football Lab Premier League',
            format: 'single-round-robin',
            clubIds: premierLeague.map(c => c.id)
          };
          await writeFile(`${dir}/metadata.json`, JSON.stringify(metadata, null, 2) + '\n');
          console.log(`Playable Premier League expanded to ${metadata.playableDemo.clubIds.length} clubs.`);
          NODE

      - name: Validate complete Premier League database
        run: |
          node scripts/validate-database.mjs artifacts/api-football-epl-complete/merged-current
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const dir = 'artifacts/api-football-epl-complete/merged-current';
          const [metadata, clubs, players] = await Promise.all(['metadata.json','clubs.json','players.json'].map(async f => JSON.parse(await readFile(`${dir}/${f}`, 'utf8'))));
          const pl = clubs.filter(c => c.leagueId === 'eng-premier-league' && !c.isPlaceholder);
          if (pl.length !== 20) throw new Error(`Premier League club count is ${pl.length}, expected 20.`);
          const playable = new Set(metadata.playableDemo?.clubIds || []);
          if (playable.size !== 20 || pl.some(c => !playable.has(c.id))) throw new Error('Playable club list does not contain all 20 Premier League clubs.');
          for (const club of pl) {
            const squad = players.filter(p => p.clubId === club.id && !p.isPlaceholder);
            if (squad.length < 15) throw new Error(`${club.name} has only ${squad.length} imported players.`);
          }
          const progress = metadata.importProgress?.['eng-premier-league'];
          if (progress?.realClubs !== 20 || progress?.status !== 'complete') throw new Error(`Import progress is not complete: ${JSON.stringify(progress)}`);
          console.log(`Complete Premier League validated: 20 clubs, ${pl.reduce((n,c) => n + players.filter(p => p.clubId === c.id && !p.isPlaceholder).length, 0)} players across PL squads.`);
          NODE

      - name: Promote completed Premier League database
        run: |
          for file in metadata.json leagues.json clubs.json players.json managers.json; do
            cp "artifacts/api-football-epl-complete/merged-current/$file" "data/current/$file"
          done
          node scripts/validate-database.mjs data/current
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/metadata.json data/current/leagues.json data/current/clubs.json data/current/players.json data/current/managers.json
          git commit -m "Complete 20-club Premier League database"
          git push origin HEAD:main

      - name: Upload import diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-football-epl-complete-${{ github.run_id }}
          path: artifacts/api-football-epl-complete
          retention-days: 3
          if-no-files-found: warn
