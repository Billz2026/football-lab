name: V46 Viktor windup fix

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-viktor-windup-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Widen visual windup window
        run: |
          sed -i 's/p.run < 0.4) return { clip: "approach", t: p.run \/ 0.4/p.run < 0.35) return { clip: "approach", t: p.run \/ 0.35/' game/character-3d-v46.js
          sed -i 's/p.run < 0.55) return { clip: "plant", t: (p.run - 0.4) \/ 0.15/p.run < 0.45) return { clip: "plant", t: (p.run - 0.35) \/ 0.1/' game/character-3d-v46.js
          sed -i 's/p.run < 0.9) return { clip: "windup", t: (p.run - 0.55) \/ 0.35/p.run < 1) return { clip: "windup", t: (p.run - 0.45) \/ 0.55/' game/character-3d-v46.js
          sed -i 's/return { clip: "contact", t: (p.run - 0.9) \/ 0.1, p };/return { clip: "contact", t: 0, p };/' game/character-3d-v46.js
          grep -q 'p.run < 1) return { clip: "windup"' game/character-3d-v46.js
          node --check game/character-3d-v46.js
          git diff --check
      - name: Commit Viktor visual timing fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/character-3d-v46.js
          git commit -m 'Make Viktor windup visibly readable'
          git push origin HEAD:agent/v46-real-3d-character-layer
