name: FLM API-Football English Database v1

on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Club offset in PL + Championship manifest (0-43)'
        required: true
        default: '0'
      count:
        description: 'Number of clubs to import this run'
        required: true
        default: '8'
      promote:
        description: 'Promote validated merged data into data/current'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FLM_BATCH_OFFSET: ${{ github.event.inputs.offset || '0' }}
      FLM_BATCH_COUNT: ${{ github.event.inputs.count || '8' }}
      FLM_REQUEST_DELAY_MS: '7000'
      FLM_DAILY_RESERVE: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify API-Football secret
        run: |
          if [ -z "$API_FOOTBALL_KEY" ]; then
            echo "API_FOOTBALL_KEY repository secret is missing."
            exit 1
          fi
          echo "API-Football secret is configured."
      - name: Import current English squad batch
        run: node scripts/import-api-football-english-free.mjs artifacts/api-football-english-db-v1
      - name: Validate sanitised batch
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const dir = 'artifacts/api-football-english-db-v1';
          const [clubs, players, report] = await Promise.all(['clubs-batch.json','players-batch.json','report.json'].map(async f => JSON.parse(await readFile(`${dir}/${f}`, 'utf8'))));
          if (!clubs.length) throw new Error('No clubs imported.');
          if (players.length < clubs.length * 15) throw new Error('Squad coverage is unexpectedly low.');
          if (players.some(p => p.isPlaceholder)) throw new Error('Imported batch contains placeholders.');
          if (new Set(players.map(p => p.id)).size !== players.length) throw new Error('Imported batch still contains duplicate player IDs.');
          if (players.some(p => !p.attributes?.technical || !p.attributes?.mental || !p.attributes?.physical)) throw new Error('Imported player missing attribute blocks.');
          console.log(`Validated ${clubs.length} clubs and ${players.length} unique players.`);
          console.log(`Membership conflicts resolved: ${report.result.squadMembershipConflicts ?? 0}`);
          console.log(`Remaining daily requests: ${report.usage.lastKnownRemainingDailyRequests ?? 'unknown'}`);
          NODE
      - name: Build merged current-database preview
        run: node scripts/merge-api-football-english-batch.mjs artifacts/api-football-english-db-v1 data/current artifacts/api-football-english-db-v1/merged-current
      - name: Validate merged database preview
        run: node scripts/validate-database.mjs artifacts/api-football-english-db-v1/merged-current
      - name: Promote validated database batch
        if: ${{ github.event.inputs.promote == 'true' }}
        run: |
          for file in metadata.json leagues.json clubs.json players.json managers.json; do
            cp "artifacts/api-football-english-db-v1/merged-current/$file" "data/current/$file"
          done
          node scripts/validate-database.mjs data/current
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current/metadata.json data/current/leagues.json data/current/clubs.json data/current/players.json data/current/managers.json
          if git diff --cached --quiet; then
            echo "No database changes to promote."
            exit 0
          fi
          git commit -m "Import API-Football English squad batch ${FLM_BATCH_OFFSET}-${FLM_BATCH_COUNT}"
          git push origin HEAD:main
      - name: Upload sanitised FLM batch
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-football-english-db-v1-${{ github.run_id }}
          path: artifacts/api-football-english-db-v1
          retention-days: 3
          if-no-files-found: warn
