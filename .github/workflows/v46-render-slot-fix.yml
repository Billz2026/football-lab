name: Repair V46 keeper render slot

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-render-slot-fix.yml'
      - 'scripts/patch-v46-render-slot.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Patch keeper into authoritative scene slot
        run: python3 scripts/patch-v46-render-slot.py
      - name: Validate patch
        run: |
          grep -q 'V46 keeper scene slot' game/render-v11-4-base.js
          git diff --check
      - name: Commit render-slot fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/render-v11-4-base.js
          git commit -m 'Drive V46 keeper from live scene render slot'
          git push origin HEAD:agent/v46-real-3d-character-layer
