name: V46 Mikkel shot gate fix

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-mikkel-shot-gate-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Patch Mikkel real-shot visual gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/character-v46-keeper-visual.spec.js')
          text = path.read_text()
          old = '''async function executeLiveShot(page) {
            await dismissCoach(page);
            await expect(page.locator("#shotAction")).toHaveText("START SHOT", { timeout: 6000 });
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 3000 }
            ).toBe("ready");

            const expected = [
              ["aim", "STRIKE"],
              ["power", "LOCK POWER"],
              ["contact", "LOCK CONTACT"],
              ["shooting", "SHOT IN PLAY"]
            ];
            const delays = [120, 180, 180, 0];
            const trace = [];
            for (let index = 0; index < expected.length; index += 1) {
              trace.push(await browserKeyboardAction(page));
              const [phase, label] = expected[index];
              await expect.poll(
                () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
                { timeout: 2500 }
              ).toBe(phase);
              await expect.poll(
                () => page.locator("#shotAction").textContent(),
                { timeout: 2500 }
              ).toContain(label);
              if (delays[index]) await page.waitForTimeout(delays[index]);
            }
            console.log("MIKKEL_V46_SHOT_INPUT_TRACE", JSON.stringify(trace));
          }'''.replace(/^          /gm, '')
          new = '''async function executeLiveShot(page) {
            await dismissCoach(page);
            await expect(page.locator("#shotAction")).toHaveText("START SHOT", { timeout: 6000 });
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 3000 }
            ).toBe("ready");

            const trace = [];

            trace.push(await browserKeyboardAction(page));
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 2500 }
            ).toBe("aim");
            await expect(page.locator("#shotAction")).toContainText("STRIKE");

            await page.evaluate(async () => {
              const core = await import("/game/core-v6.js?v=32.4");
              core.state.shot.previewAimX = 0.78;
              core.state.shot.previewAimY = 0.20;
              core.state.shot.previewCurve = 0;
            });
            trace.push(await browserKeyboardAction(page));
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 2500 }
            ).toBe("power");
            await expect(page.locator("#shotAction")).toContainText("LOCK POWER");

            await page.evaluate(async () => {
              const core = await import("/game/core-v6.js?v=32.4");
              core.state.meterValue = core.idealPower();
              core.state.lastTime = performance.now();
            });
            trace.push(await browserKeyboardAction(page));
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 2500 }
            ).toBe("contact");
            await expect(page.locator("#shotAction")).toContainText("LOCK CONTACT");

            await page.evaluate(async () => {
              const core = await import("/game/core-v6.js?v=32.4");
              core.state.meterValue = 0.5;
              core.state.lastTime = performance.now();
            });
            trace.push(await browserKeyboardAction(page));
            await expect.poll(
              () => page.evaluate(() => document.documentElement.dataset.strikePhaseV324),
              { timeout: 2500 }
            ).toBe("shooting");
            await expect(page.locator("#shotAction")).toContainText("SHOT IN PLAY");

            const shot = await page.evaluate(async () => {
              const core = await import("/game/core-v6.js?v=32.4");
              return {
                outcome: core.state.shot?.outcome,
                keeperPlan: core.state.shot?.keeperPlan,
                diagnostics: core.state.shot?.diagnostics,
                aimX: core.state.shot?.aimX,
                aimY: core.state.shot?.aimY,
                power: core.state.shot?.power,
                contactQuality: core.state.shot?.contactQuality
              };
            });
            console.log("MIKKEL_V46_SHOT_INPUT_TRACE", JSON.stringify(trace));
            console.log("MIKKEL_V46_REAL_SHOT", JSON.stringify(shot));
            expect(shot.keeperPlan).toBeTruthy();
            expect(["GOAL", "SAVE"]).toContain(shot.outcome);
          }'''.replace(/^          /gm, '')
          if old not in text:
              raise SystemExit('Mikkel executeLiveShot block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit Mikkel gate fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/character-v46-keeper-visual.spec.js
          git commit -m 'Drive Mikkel gate with real keeper-testing shot'
          git push origin HEAD:agent/v46-real-3d-character-layer
