name: Apply V40.3A stadium progression architecture

on:
  push:
    paths:
      - "tools/apply-v40-3a.mjs"
      - ".github/workflows/apply-v40-3a.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V40.3A patch
        run: node tools/apply-v40-3a.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check app.js
          node --check sw.js
      - name: Verify V40.3A stadium contracts
        run: |
          grep -q 'function stadiumQualityV403A' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'FOUNDATION GROUND' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'BOROUGH ARENA' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'CONTINENTAL PARK' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'TEMPEST STADIUM' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'CROWN ARENA' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'SUMMIT BOWL' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'keeperClearLane: true' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'tiers: 3' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'stadiumProgression: "six-distinct-chapter-venues-academy-to-summit"' app.js
          grep -q 'badge.textContent = "V40.3A"' app.js
      - name: Guard frozen gameplay systems
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          allowed='^(app\.js|sw\.js|game/runtime-v23-main\.js|game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7\.js|game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b\.js|game/runtime-v23-generated-render-v15-v1731-1b04a249af\.js|game/runtime-v23-generated-render-v17-v1731-7f257084b1\.js|game/runtime-v23-bridge-render-v17-3-1-64b7ab3399\.js)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected gameplay/system files changed:"
            echo "$bad"
            exit 1
          fi
          if git diff --unified=0 -- game/runtime-v23-main.js | grep -E '^[+-][^+-].*(resolveShotPhysics|difficultyForStage|scoreShot|keeperForStage|wallForStage)' >/dev/null; then
            echo 'Protected gameplay line changed unexpectedly'
            exit 1
          fi
      - name: Commit V40.3A
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          if git diff --cached --quiet; then
            echo "No V40.3A changes to commit"
            exit 0
          fi
          git commit -m "Build V40.3A stadium progression architecture"
          git push
