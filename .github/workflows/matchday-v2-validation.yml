name: Matchday Commentary V3 validation

on:
  push:
    branches: [main]
    paths:
      - 'manager-shell-v1.js'
      - 'matchday-cm-v2.js'
      - 'matchday-cm-v2.css'
      - 'matchday-density-v332.js'
      - 'matchday-density-v332.css'
      - 'matchday-stability-v333.js'
      - 'matchday-stability-v333.css'
      - 'match-centre-v4.js'
      - 'match-centre-v4.css'
      - 'match-centre-v4-mode.js'
      - 'match-centre-v4-fold-v41.js'
      - 'match-centre-v4-fold-v41.css'
      - 'match-centre-v4-mobile-v42.js'
      - 'match-centre-v4-mobile-v42.css'
      - 'match-centre-v4-discipline-v44.js'
      - 'match-centre-v4-discipline-v44.css'
      - 'match-centre-v45.js'
      - 'match-centre-v45.css'
      - 'match-centre-v46-lock.js'
      - 'match-centre-v46-lock.css'
      - 'matchday-engine-v069.js'
      - 'matchday-engine-v0431.js'
      - 'matchday-structured-attacks-v1.js'
      - 'matchday-structured-flow-v1.js'
      - 'matchday-live-state-authority-v3.js'
      - 'commentary-authoritative-attacks-v2.js'
      - 'commentary-authoritative-flow-v3.js'
      - 'commentary-authoritative-row-host-v1.js'
      - 'match-drama-v3.js'
      - 'manager.js'
      - 'package.json'
      - 'tests/helpers/start-career.js'
      - 'tests/structured-attacks-v1.test.js'
      - 'tests/structured-flow-v1.test.js'
      - 'tests/matchday-commentary-v3.spec.js'
      - 'tests/matchday-v2.spec.js'
      - 'tests/matchday-v44.spec.js'
      - 'tests/matchday-v45.spec.js'
      - 'tests/matchday-v46.spec.js'
      - '.github/workflows/matchday-v2-validation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'manager-shell-v1.js'
      - 'matchday-cm-v2.js'
      - 'matchday-cm-v2.css'
      - 'matchday-density-v332.js'
      - 'matchday-density-v332.css'
      - 'matchday-stability-v333.js'
      - 'matchday-stability-v333.css'
      - 'match-centre-v4.js'
      - 'match-centre-v4.css'
      - 'match-centre-v4-mode.js'
      - 'match-centre-v4-fold-v41.js'
      - 'match-centre-v4-fold-v41.css'
      - 'match-centre-v4-mobile-v42.js'
      - 'match-centre-v4-mobile-v42.css'
      - 'match-centre-v4-discipline-v44.js'
      - 'match-centre-v4-discipline-v44.css'
      - 'match-centre-v45.js'
      - 'match-centre-v45.css'
      - 'match-centre-v46-lock.js'
      - 'match-centre-v46-lock.css'
      - 'matchday-engine-v069.js'
      - 'matchday-engine-v0431.js'
      - 'matchday-structured-attacks-v1.js'
      - 'matchday-structured-flow-v1.js'
      - 'matchday-live-state-authority-v3.js'
      - 'commentary-authoritative-attacks-v2.js'
      - 'commentary-authoritative-flow-v3.js'
      - 'commentary-authoritative-row-host-v1.js'
      - 'match-drama-v3.js'
      - 'manager.js'
      - 'package.json'
      - 'tests/helpers/start-career.js'
      - 'tests/structured-attacks-v1.test.js'
      - 'tests/structured-flow-v1.test.js'
      - 'tests/matchday-commentary-v3.spec.js'
      - 'tests/matchday-v2.spec.js'
      - 'tests/matchday-v44.spec.js'
      - 'tests/matchday-v45.spec.js'
      - 'tests/matchday-v46.spec.js'
      - '.github/workflows/matchday-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-matchday-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Matchday syntax
        run: |
          node --check manager-shell-v1.js
          node --check matchday-cm-v2.js
          node --check matchday-density-v332.js
          node --check matchday-stability-v333.js
          node --check match-centre-v4.js
          node --check match-centre-v4-mode.js
          node --check match-centre-v4-fold-v41.js
          node --check match-centre-v4-mobile-v42.js
          node --check match-centre-v4-discipline-v44.js
          node --check match-centre-v45.js
          node --check match-centre-v46-lock.js
          node --check matchday-engine-v069.js
          node --check matchday-engine-v0431.js
          node --check matchday-structured-attacks-v1.js
          node --check matchday-structured-flow-v1.js
          node --check matchday-live-state-authority-v3.js
          node --check commentary-authoritative-attacks-v2.js
          node --check commentary-authoritative-flow-v3.js
          node --check commentary-authoritative-row-host-v1.js
          node --check match-drama-v3.js
          node --check tests/helpers/start-career.js
          node --check tests/structured-attacks-v1.test.js
          node --check tests/structured-flow-v1.test.js
          node --check tests/matchday-commentary-v3.spec.js
          node --check tests/matchday-v2.spec.js
          node --check tests/matchday-v44.spec.js
          node --check tests/matchday-v45.spec.js
          node --check tests/matchday-v46.spec.js

      - name: Install dependencies
        run: npm ci

      - name: Run structured engine contracts
        run: node --test tests/structured-attacks-v1.test.js tests/structured-flow-v1.test.js

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Commentary V3 browser contract
        run: npx playwright test tests/matchday-commentary-v3.spec.js --config=playwright.ci.config.js --reporter=line --workers=1

      - name: Run Matchday regression suite
        run: npx playwright test tests/matchday-v2.spec.js tests/matchday-v44.spec.js tests/matchday-v45.spec.js tests/matchday-v46.spec.js --config=playwright.ci.config.js --reporter=line --workers=1
