name: V46 keeper hook ownership fix

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-keeper-hook-fix.yml'
      - 'scripts/patch-v46-keeper-hook.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0
      - name: Patch V46 keeper hook
        run: python3 scripts/patch-v46-keeper-hook.py
      - name: Validate syntax and markers
        run: |
          node --check game/character-3d-v46.js
          grep -q '__footballLabV46KeeperHook' game/character-3d-v46.js
          grep -q '__footballLabKeeperRendererV44' game/character-3d-v46.js
          git diff --check
      - name: Commit hook fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/character-3d-v46.js
          git commit -m 'Make V46 keeper hook deterministic'
          git push origin HEAD:agent/v46-real-3d-character-layer
