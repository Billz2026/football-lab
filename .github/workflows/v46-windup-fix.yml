name: Repair V46 strike render sequencing

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-windup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0

      - name: Preserve visible contact on slow frames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/character-3d-v46.js')
          text = path.read_text()
          needle = '    if (p.flight < 0.58) return frame("follow-through", clamp(p.flight / 0.58, 0, 1));'
          guard = '    if (outfieldPhase.lastClip === "windup") return frame("contact", 0.94);'
          if guard not in text:
              if needle not in text:
                  raise SystemExit('Expected V46 follow-through line not found')
              replacement = (
                  '    if (outfieldPhase.lastClip === "plant") return frame("windup", 0.94);\n'
                  + guard + '\n'
                  + needle
              )
              text = text.replace(needle, replacement, 1)
              path.write_text(text)
          PY

      - name: Validate targeted patch
        shell: bash
        run: |
          grep -q 'outfieldPhase.lastClip === "windup"' game/character-3d-v46.js
          git diff --check

      - name: Commit strike sequencing repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/character-3d-v46.js
          git commit -m 'Preserve V46 contact pose on slow render frames'
          git push origin HEAD:agent/v46-real-3d-character-layer
