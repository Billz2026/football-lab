name: Repair V46 release blockers

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-windup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0

      - name: Patch Viktor render sequencing and current-flow regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          character_path = Path('game/character-3d-v46.js')
          text = character_path.read_text()
          old = '''function outfieldPhase(time) {
            const p = outfieldProgress(time);
            if (!liveState().animation) return { clip: "idle", t: (time % 2400) / 2400, p };
            if (p.replay || p.flight > 0 || p.settle > 0) {
              if (p.flight < 0.58) return { clip: "follow-through", t: clamp(p.flight / 0.58, 0, 1), p };
              return { clip: "recovery", t: Math.max(clamp((p.flight - 0.58) / 0.42, 0, 1), p.settle), p };
            }
            if (p.contact > 0) return { clip: "contact", t: p.contact, p };
            // Keep the authoritative 560 ms run-up unchanged, but give the kicking leg enough
            // visual preparation to read as a real strike at gameplay frame rates.
            if (p.run < 0.35) return { clip: "approach", t: p.run / 0.35, p };
            if (p.run < 0.45) return { clip: "plant", t: (p.run - 0.35) / 0.1, p };
            if (p.run < 1) return { clip: "windup", t: (p.run - 0.45) / 0.55, p };
            return { clip: "contact", t: 0, p };
          }
          '''
          new = '''function outfieldPhase(time) {
            const gameState = liveState();
            const animation = gameState.animation;
            const p = outfieldProgress(time);
            const animationToken = animation?.startedAt ?? null;
            if (outfieldPhase.animationToken !== animationToken) {
              outfieldPhase.animationToken = animationToken;
              outfieldPhase.lastClip = null;
            }
            const frame = (clip, t) => {
              outfieldPhase.lastClip = clip;
              return { clip, t, p };
            };

            if (!animation) return frame("idle", (time % 2400) / 2400);
            if (p.replay || p.flight > 0 || p.settle > 0) {
              if (p.flight < 0.58) return frame("follow-through", clamp(p.flight / 0.58, 0, 1));
              return frame("recovery", Math.max(clamp((p.flight - 0.58) / 0.42, 0, 1), p.settle));
            }
            if (p.contact > 0) {
              // Software WebGL and low-end devices can miss the 3D wind-up window even though
              // the authoritative 560 ms run-up is correct. Preserve gameplay timing, but never
              // let the visible body jump directly from plant to contact.
              if (outfieldPhase.lastClip === "plant") return frame("windup", 0.94);
              return frame("contact", p.contact);
            }
            if (p.run < 0.35) return frame("approach", p.run / 0.35);
            if (p.run < 0.45) return frame("plant", (p.run - 0.35) / 0.1);
            if (p.run < 1) return frame("windup", (p.run - 0.45) / 0.55);
            if (outfieldPhase.lastClip === "plant") return frame("windup", 0.94);
            return frame("contact", 0);
          }
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('Current V46 outfieldPhase block not found')
              character_path.write_text(text.replace(old, new))

          test_path = Path('tests/runtime-v23.spec.js')
          test_text = test_path.read_text()
          old_test = '''  await page.locator("#shotAction").click();
            await expect(page.locator("#phaseTitle")).toHaveText("STOP POWER");
            await page.waitForTimeout(90);
          '''
          new_test = '''  await page.locator("#shotAction").click();
            await expect(page.locator("#shotAction")).toHaveText("STRIKE");
            await expect(page.locator("#phaseTitle")).toHaveText("PLAN THE STRIKE");
            await page.waitForTimeout(120);
            await page.locator("#shotAction").click();
            await expect(page.locator("#phaseTitle")).toHaveText("STOP POWER");
            await page.waitForTimeout(90);
          '''
          if new_test not in test_text:
              if old_test not in test_text:
                  raise SystemExit('Legacy runtime flow assertion block not found')
              test_path.write_text(test_text.replace(old_test, new_test))
          PY

      - name: Validate targeted patch
        shell: bash
        run: |
          grep -q 'outfieldPhase.lastClip === "plant"' game/character-3d-v46.js
          grep -q 'toHaveText("STRIKE")' tests/runtime-v23.spec.js
          grep -q 'toHaveText("STOP POWER")' tests/runtime-v23.spec.js
          git diff --check

      - name: Commit release-blocker repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/character-3d-v46.js tests/runtime-v23.spec.js
          git commit -m 'Fix V46 strike sequencing and current flow regression'
          git push origin HEAD:agent/v46-real-3d-character-layer
