name: Repair V46 strike render sequencing

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-windup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0

      - name: Preserve visible windup and contact on slow frames
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('game/character-3d-v46.js')
          text = path.read_text()
          old = '''  if (p.replay || p.flight > 0 || p.settle > 0) {
            if (p.flight < 0.58) return frame("follow-through", clamp(p.flight / 0.58, 0, 1));
            return frame("recovery", Math.max(clamp((p.flight - 0.58) / 0.42, 0, 1), p.settle));
          }
          '''
          new = '''  if (p.replay || p.flight > 0 || p.settle > 0) {
            // Preserve the strike silhouette when a slow render frame jumps across one or
            // more short animation windows. This is presentation-only: gameplay clocks,
            // ball physics and shot timing remain authoritative and unchanged.
            if (outfieldPhase.lastClip === "plant") return frame("windup", 0.94);
            if (outfieldPhase.lastClip === "windup") return frame("contact", 0.94);
            if (p.flight < 0.58) return frame("follow-through", clamp(p.flight / 0.58, 0, 1));
            return frame("recovery", Math.max(clamp((p.flight - 0.58) / 0.42, 0, 1), p.settle));
          }
          '''
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected V46 flight transition block not found')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Validate targeted patch
        shell: bash
        run: |
          grep -q 'outfieldPhase.lastClip === "windup"' game/character-3d-v46.js
          git diff --check

      - name: Commit strike sequencing repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/character-3d-v46.js
          git commit -m 'Preserve V46 contact pose on slow render frames'
          git push origin HEAD:agent/v46-real-3d-character-layer
