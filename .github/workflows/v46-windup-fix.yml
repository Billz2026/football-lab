name: Repair V46 visible strike bridge

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-windup-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v46-real-3d-character-layer
          fetch-depth: 0

      - name: Make the visible STRIKE bridge survive static runtime regeneration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('game/main-v18.js')
          source = source_path.read_text()
          marker = '''replaceRequired(
            "keyboard event timestamp",'''
          bridge_label = '"planned strike event bridge"'
          bridge = r'''replaceRequired(
            "planned strike event bridge",
            \`elements.canvas.style.touchAction = "manipulation";\\nelements.shotAction.style.touchAction = "manipulation";\`,
            \`elements.canvas.style.touchAction = "manipulation";\\nelements.shotAction.style.touchAction = "manipulation";\\n\\nwindow.addEventListener("footballlab:takeplannedshot", () => {\\n  if (state.screen !== "game" || state.phase !== "aim" || state.animation) return;\\n  state.actionLockedUntil = 0;\\n  suppressActionClickUntil = 0;\\n  handleAction(performance.now());\\n});\\n\\nwindow.addEventListener("footballlab:beginstrike", () => {\\n  if (state.screen !== "game" || state.phase !== "aim" || state.animation) return;\\n  state.actionLockedUntil = 0;\\n  suppressActionClickUntil = 0;\\n  handleAction(performance.now());\\n});\`
          );
          '''
          if bridge_label not in source:
              if marker not in source:
                  raise SystemExit('main-v18 keyboard patch marker not found')
              source = source.replace(marker, bridge + marker, 1)
              source_path.write_text(source)

          runtime_path = Path('game/runtime-v23-main.js')
          runtime = runtime_path.read_text()
          for event_name in ('footballlab:takeplannedshot', 'footballlab:beginstrike'):
              old = f'''window.addEventListener("{event_name}", () => {{\n  if (state.screen !== "game" || state.phase !== "aim" || state.animation) return;\n  suppressActionClickUntil = 0;\n  handleAction(performance.now());\n}});'''
              new = f'''window.addEventListener("{event_name}", () => {{\n  if (state.screen !== "game" || state.phase !== "aim" || state.animation) return;\n  state.actionLockedUntil = 0;\n  suppressActionClickUntil = 0;\n  handleAction(performance.now());\n}});'''
              if new not in runtime:
                  if old not in runtime:
                      raise SystemExit(f'{event_name} runtime listener not found')
                  runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime)
          PY

      - name: Validate generator and committed runtime
        shell: bash
        run: |
          node --check game/main-v18.js
          node --check game/runtime-v23-main.js
          grep -q 'planned strike event bridge' game/main-v18.js
          test "$(grep -c 'state.actionLockedUntil = 0;' game/runtime-v23-main.js)" -ge 2
          git diff --check

      - name: Commit visible strike bridge repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/main-v18.js game/runtime-v23-main.js
          git commit -m 'Preserve visible strike bridge in static runtime builds'
          git push origin HEAD:agent/v46-real-3d-character-layer
