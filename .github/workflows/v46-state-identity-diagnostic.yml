name: V46 state identity diagnostic

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - '.github/workflows/v46-state-identity-diagnostic.yml'
      - 'tests/v46-live-state-diagnostic.spec.js'
      - 'tests/v46-keeper-hook-diagnostic.spec.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build:runtime:v23
      - name: Trace live V46 state and keeper hook ownership
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/v46-live-state-diagnostic.spec.js tests/v46-keeper-hook-diagnostic.spec.js --reporter=line 2>&1 | tee v46-live-state-trace.txt
