name: Mikkel V46 visual gate

on:
  push:
    branches:
      - agent/v46-real-3d-character-layer
    paths:
      - game/assets/characters/v1/goalkeeper/mikkel-storm/mikkel-storm.glb
      - .github/workflows/visual-mikkel-v46.yml
      - .github/v46-release-trigger
      - tests/character-v46-keeper-visual.spec.js
      - game/character-3d-v46.js
      - game/keeper-visuals-v38-1.js
      - game/render-v17-3-1.js
      - game/core-v6.js
      - game/strike-v32-4.js
      - game/main-v18.js
      - game/main-v15-2.js
      - game/main-v11-3.js
      - scripts/capture-runtime-v23.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-lab-mikkel-v46-visual
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out V46 branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build V46 runtime bridge
        run: npm run build:runtime:v23

      - name: Capture Mikkel set and live dive
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/character-v46-keeper-visual.spec.js --reporter=line 2>&1 | tee mikkel-v46-visual-output.txt

      - name: Publish diagnostic text to branch
        if: always()
        shell: bash
        run: |
          mkdir -p .github/diagnostics
          cp mikkel-v46-visual-output.txt .github/diagnostics/mikkel-v46-visual-output.txt 2>/dev/null || printf 'visual test produced no output file\n' > .github/diagnostics/mikkel-v46-visual-output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/diagnostics/mikkel-v46-visual-output.txt
          if git diff --cached --quiet; then
            echo 'Diagnostic output unchanged.'
          else
            git commit -m 'Capture Mikkel V46 visual diagnostic output'
            git push origin HEAD:agent/v46-real-3d-character-layer
          fi

      - name: Upload visual gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mikkel-v46-visual-gate-${{ github.run_id }}
          path: |
            test-results/mikkel-v46-set.png
            test-results/mikkel-v46-dive.png
            test-results/mikkel-v46-landing.png
            test-results/mikkel-v46-recovery.png
            test-results/mikkel-v46-full-ui.png
            mikkel-v46-visual-output.txt
          if-no-files-found: warn
          retention-days: 14