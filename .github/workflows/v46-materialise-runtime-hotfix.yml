name: Materialise V46 static runtime hotfix

on:
  push:
    branches:
      - hotfix/v46-live-render-path
    paths:
      - '.github/workflows/v46-materialise-runtime-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v46-live-render-path
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Regenerate committed static runtime from authoritative sources
        run: |
          npm run build:runtime:v23
          npm run verify:runtime:v23
          git diff --check

      - name: Show materialised V46 bridge
        shell: bash
        run: |
          grep -n 'character-3d-v46\|drawHeroCharacterV46\|production3D' game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js

      - name: Commit generated runtime
        shell: bash
        run: |
          if git diff --quiet -- game/runtime-v23-*.js game/runtime-v23-manifest.json; then
            echo 'Static runtime already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/runtime-v23-*.js game/runtime-v23-manifest.json
          git commit -m 'Materialise V46 production render path in static runtime'
          git push origin HEAD:hotfix/v46-live-render-path
