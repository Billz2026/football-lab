name: Apply V38.6 ball and impact feel

on:
  push:
    paths:
      - "tools/apply-v38-6.mjs"
      - ".github/workflows/apply-v38-6.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V38.6 presentation patch
        run: node tools/apply-v38-6.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          node --check game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js
          node --check game/runtime-v23-generated-render-v15-v1731-1b04a249af.js
          node --check game/runtime-v23-generated-render-v17-v1731-7f257084b1.js
          node --check game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js
          node --check game/runtime-v23-main.js
          node --check game/flight-v33.js
          node --check game/audio-v32.js
          node --check app.js
      - name: Verify presentation-only markers
        run: |
          grep -q '__footballLabBallImpactV386' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'persistentNetRipple: true' game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          grep -q 'presentationOnly: true' game/flight-v33.js
          grep -q '__footballLabAudioV386' game/audio-v32.js
          grep -q 'runtime-v23-main.js?v=38.6.0' app.js
      - name: Confirm gameplay resolver untouched
        run: git diff --exit-code HEAD -- game/runtime-v23-bridge-physics-v19-f1d39f9409.js game/keeper-ai-v34.js game/difficulty-v9.js game/core-v6.js
      - name: Commit V38.6
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js \
            game/audio-v32.js \
            game/flight-v33.js \
            game/runtime-v23-main.js \
            game/runtime-v23-bridge-render-v17-3-1-64b7ab3399.js \
            game/runtime-v23-generated-render-v17-v1731-7f257084b1.js \
            game/runtime-v23-generated-render-v15-v1731-1b04a249af.js \
            game/runtime-v23-bridge-render-v9-v17-3-1-daf59fdc4b.js \
            game/runtime-v23-generated-render-v17-1-base-v1731-33ac3afcb7.js
          if git diff --cached --quiet; then
            echo "No V38.6 changes to commit"
            exit 0
          fi
          git commit -m "Build V38.6 ball flight and impact feel"
          git push
